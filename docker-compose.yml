services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Initialize the default bucket automatically
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/audio-ingest --ignore-existing;
      /usr/bin/mc anonymous set public myminio/audio-ingest;
      exit 0;
      "

  audio-ingest:
    image: ghcr.io/stenseegel/audio-ingest:latest
    depends_on:
      - redis
      - minio-init
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=2
      - QUEUE_NAME=audio_preprocessing_jobs
      - STATUS_QUEUE=audio_preprocessing_status
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
    volumes:
      - .:/app

volumes:
  redis_data:
  minio_data:
